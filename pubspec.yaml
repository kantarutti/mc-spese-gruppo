name: mc_spese_gruppo
description: "App per la gestione delle spese di gruppo con conguagli e statistiche."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  
  # Database Cloud e Auth
  supabase_flutter: ^2.5.0
  share_plus: ^7.0.0
  url_launcher: ^6.2.5
  shared_preferences: ^2.3.2

  # Gestione dello Stato
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4

  # Gestione lingue
  easy_localization: ^3.0.7

  # Networking (Necessario per il cambio valuta live)
  http: ^1.1.0

  # Grafici e UI
  fl_chart: ^0.67.0
  font_awesome_flutter: ^10.7.0
  animations: ^2.0.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.3.11

flutter:
  uses-material-design: true

  assets:
    # Icone già presenti
    - assets/icons/Icon-SDG-512.webp
    - assets/icons/Icon-SDG-maskable-512.webp

    # Cartella dati JSON (nuova)
    - assets/data/

    # Cartella Traduzioni
    - assets/translations/it.json
    - assets/translations/en.json
    - assets/translations/es.json
    - assets/translations/fr.json
    